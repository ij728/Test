<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Super Bros Adventure</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; touch-action:none;
    font-family:'Segoe UI', Arial, sans-serif; user-select:none; -webkit-user-select:none; }
  #game { display:block; width:100%; height:100%; }
  .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; background:linear-gradient(180deg,#5c94fc 0%,#8ec5ff 60%,#bfe3ff 100%);
    z-index:10; text-align:center; padding:20px; }
  .overlay h1 { color:#fff; font-size:clamp(28px,6vw,52px); text-shadow:3px 3px 0 #d04040, 6px 6px 0 rgba(0,0,0,.25);
    letter-spacing:2px; margin-bottom:8px; }
  .overlay p { color:#fff; font-size:clamp(14px,3vw,20px); text-shadow:1px 1px 2px rgba(0,0,0,.4); margin-bottom:24px; }
  .chars { display:flex; gap:28px; margin-bottom:24px; }
  .charBtn { background:#fff; border:4px solid #333; border-radius:18px; padding:14px 18px;
    cursor:pointer; transition:transform .12s; box-shadow:0 6px 0 rgba(0,0,0,.3); }
  .charBtn:active { transform:scale(.94) translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.3); }
  .charBtn img { width:clamp(80px,20vw,130px); height:clamp(80px,20vw,130px); border-radius:50%;
    object-fit:cover; border:4px solid; display:block; }
  .charBtn span { display:block; margin-top:8px; font-weight:bold; font-size:clamp(14px,3vw,18px); color:#333; }
  #charRed img { border-color:#d04040; }
  #charBlue img { border-color:#3a7bd5; }
  .bigBtn { background:#ffd23f; border:4px solid #333; border-radius:14px; padding:14px 36px;
    font-size:clamp(18px,4vw,26px); font-weight:bold; color:#333; cursor:pointer;
    box-shadow:0 6px 0 rgba(0,0,0,.3); }
  .bigBtn:active { transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.3); }
  .hidden { display:none !important; }
  #endTitle { font-size:clamp(32px,8vw,64px); }
  #endStats { font-size:clamp(18px,4vw,26px); }
  .hint { position:absolute; bottom:14px; width:100%; color:rgba(255,255,255,.85);
    font-size:13px; text-shadow:1px 1px 2px rgba(0,0,0,.4); }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="menu" class="overlay">
  <h1>SUPER BROS<br>ADVENTURE</h1>
  <p>Pick your hero!</p>
  <div class="chars">
    <button class="charBtn" id="charRed"><img id="imgRedBtn" alt="Red hero"><span>Marvel Kid</span></button>
    <button class="charBtn" id="charBlue"><img id="imgBlueBtn" alt="Blue hero"><span>LA Kid</span></button>
  </div>
  <div class="hint">Stomp enemies &bull; Grab coins &bull; Reach the flag!</div>
</div>

<div id="end" class="overlay hidden">
  <h1 id="endTitle"></h1>
  <p id="endStats"></p>
  <button class="bigBtn" id="againBtn">PLAY AGAIN</button>
</div>

// ---------- Audio (tiny synth) ----------
let AC = null;
function audio() { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); return AC; }
function beep(freq, dur, type, vol, slide) {
  try {
    const ac = audio(); if (ac.state === 'suspended') ac.resume();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, ac.currentTime + dur);
    g.gain.value = vol || 0.08;
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + dur);
  } catch (e) {}
}
const sfx = {
  jump:  () => beep(330, .18, 'square', .06, 660),
  coin:  () => { beep(988, .08, 'square', .06); setTimeout(() => beep(1319, .25, 'square', .06), 70); },
  stomp: () => beep(220, .15, 'triangle', .1, 110),
  hurt:  () => beep(180, .4, 'sawtooth', .08, 60),
  block: () => beep(140, .1, 'square', .07),
  win:   () => { [523,659,784,1047].forEach((f,i) => setTimeout(() => beep(f, .25, 'square', .07), i*140)); },
};

// ---------- Level ----------
const T = 32;                       // tile size
const ROWS = 15;                    // 15*32 = 480 = VIEW_H
const COLS = 220;
// tile codes: 0 air, 1 ground, 2 brick, 3 ?-block, 4 used block, 5 pipe
let grid, coins, enemies, flagX, levelW;

function buildLevel() {
  grid = Array.from({length: COLS}, () => new Array(ROWS).fill(0));
  coins = []; enemies = [];
  levelW = COLS * T;
  const G = ROWS - 2;               // ground top row (2 rows of ground)

  function ground(x1, x2) { for (let x = x1; x <= x2; x++) { grid[x][G] = 1; grid[x][G+1] = 1; } }
  function row(code, x1, x2, y) { for (let x = x1; x <= x2; x++) grid[x][y] = code; }
  function pipe(x, h) { for (let y = G - h; y < G; y++) { grid[x][y] = 5; grid[x+1][y] = 5; } }
  function coinRow(x1, x2, y) { for (let x = x1; x <= x2; x++) coins.push({x: x*T + T/2, y: y*T + T/2, taken: false, t: Math.random()*6}); }
  function enemy(x) { enemies.push({x: x*T, y: (G-1)*T, w: 28, h: 28, vx: -1.2, dead: 0, alive: true}); }

  // terrain with gaps (pits)
  ground(0, 28); ground(32, 55); ground(59, 88); ground(92, 124); ground(128, 168); ground(172, 219);

  // opening area
  grid[12][G-4] = 3; row(2, 16, 18, G-4); grid[17][G-8] = 3;
  coinRow(16, 18, G-5);
  pipe(24, 2);
  enemy(20);

  // section 2
  row(2, 36, 38, G-4); grid[37][G-4] = 3;
  coinRow(36, 38, G-5);
  pipe(46, 3);
  enemy(41); enemy(52);
  // stairs up
  for (let i = 0; i < 4; i++) row(2, 52 + i, 55, G-1-i);

  // section 3 — floating platforms over coins
  row(2, 63, 66, G-4); row(2, 70, 73, G-7); row(2, 77, 80, G-4);
  coinRow(63, 66, G-5); coinRow(70, 73, G-8); coinRow(77, 80, G-5);
  grid[72][G-7] = 3;
  enemy(68); enemy(84);
  pipe(86, 2);

  // section 4 — brick gauntlet
  row(2, 96, 104, G-4);
  grid[98][G-4] = 3; grid[101][G-4] = 3;
  coinRow(97, 103, G-5);
  enemy(99); enemy(106); enemy(113);
  row(2, 108, 110, G-7); coinRow(108, 110, G-8);
  pipe(120, 4);

  // section 5 — bouncy hills & coin arc
  for (let i = 0; i < 5; i++) row(2, 131 + i, 135, G-1-i);
  coinRow(138, 141, G-7); coinRow(143, 146, G-9); coinRow(148, 151, G-7);
  row(2, 143, 146, G-8);
  enemy(140); enemy(152); enemy(158);
  row(2, 155, 158, G-4); grid[156][G-4] = 3;

  // final stretch — staircase to flag
  enemy(176); enemy(184); enemy(185);
  row(2, 178, 181, G-4); coinRow(178, 181, G-5);
  for (let i = 0; i < 7; i++) for (let j = 0; j <= i; j++) grid[192 + i][G-1-j] = 2;
  flagX = 206 * T;
  coinRow(200, 203, G-3);
}

function solid(c) { return c === 1 || c === 2 || c === 3 || c === 4 || c === 5; }
function tileAt(px, py) {
  const cx = Math.floor(px / T), cy = Math.floor(py / T);
  if (cx < 0 || cx >= COLS) return 1;       // walls at level edges
  if (cy < 0 || cy >= ROWS) return 0;
  return grid[cx][cy];
}

// ---------- Player ----------
const player = { x:0, y:0, w:26, h:46, vx:0, vy:0, onGround:false, face:1, anim:0, inv:0, dead:false };
let cam = 0, score = 0, coinCount = 0, lives = 3, won = false, running = false, time = 0;
let charImg = imgRed, shirt = '#d83a3a', shorts = '#3b6fd4', cap = true;

function resetPlayer() {
  player.x = 2.5 * T; player.y = (ROWS - 4) * T;

}

// ---------- Input ----------
const keys = { left:false, right:false, jump:false };
let jumpHeld = false, jumpBuffer = 0, coyote = 0;
window.addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { if (!keys.jump) jumpBuffer = 0.12; keys.jump = true; }
});
window.addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') keys.jump = false;
});

// Touch buttons (drawn on canvas, world-view coordinates)
function btnRects() {
  const s = Math.min(VIEW_H * 0.16, 76), m = 18, by = VIEW_H - s - m;
  return {
    left:  { x: m,           y: by, w: s, h: s },
    right: { x: m + s + 14,  y: by, w: s, h: s },
    jump:  { x: viewW - s - m, y: by, w: s * 1.15, h: s },
  };
}
const touchState = {};   // touch id -> 'left'|'right'|'jump'
function touchToView(t) {
  const r = canvas.getBoundingClientRect();
  return { x: (t.clientX - r.left) / r.width * viewW, y: (t.clientY - r.top) / r.height * VIEW_H };
}
function hit(p, r) { return p.x >= r.x - 8 && p.x <= r.x + r.w + 8 && p.y >= r.y - 8 && p.y <= r.y + r.h + 8; }
function updateTouches(e) {
  const rects = btnRects();
  for (const t of e.changedTouches) {
    if (e.type === 'touchend' || e.type === 'touchcancel') { delete touchState[t.identifier]; continue; }
    const p = touchToView(t);
    let zone = null;
    for (const k of ['left','right','jump']) if (hit(p, rects[k])) zone = k;
    // fallback: left half = move zone split, right half = jump
    if (!zone) zone = p.x > viewW / 2 ? 'jump' : (p.x < viewW / 4 ? 'left' : 'right');
    if (zone === 'jump' && touchState[t.identifier] !== 'jump') jumpBuffer = 0.12;
    touchState[t.identifier] = zone;
  }
  keys.left = keys.right = keys.jump = false;
  for (const id in touchState) keys[touchState[id]] = true;
  e.preventDefault();
}
for (const ev of ['touchstart','touchmove','touchend','touchcancel'])
  canvas.addEventListener(ev, updateTouches, { passive: false });

// ---------- Physics & game logic ----------
function killPlayer() {
  if (player.inv > 0 || player.dead) return;
  sfx.hurt();
  lives--;
  if (lives <= 0) { endGame(false); return; }
  player.dead = true;
  player.vy = -11; player.vx = 0;
  setTimeout(() => { if (running) resetPlayer(); }, 900);
}

function update(dt) {
  time += dt;
  const k = dt * 60;       // normalize to 60fps units

  if (!player.dead) {
    // horizontal
    const ACC = 0.55, MAX = 4.4, FRIC = 0.78;
    if (keys.left)  { player.vx -= ACC * k; player.face = -1; }
    if (keys.right) { player.vx += ACC * k; player.face = 1; }
    if (!keys.left && !keys.right) player.vx *= Math.pow(FRIC, k);
    player.vx = Math.max(-MAX, Math.min(MAX, player.vx));
    if (Math.abs(player.vx) < 0.05) player.vx = 0;

    // jump: buffer + coyote time
    jumpBuffer = Math.max(0, jumpBuffer - dt);
    coyote = player.onGround ? 0.1 : Math.max(0, coyote - dt);
    if (jumpBuffer > 0 && coyote > 0) {
      player.vy = -12.5; player.onGround = false; coyote = 0; jumpBuffer = 0;
      jumpHeld = true; sfx.jump();
    }
    if (!keys.jump) jumpHeld = false;
    // variable jump height
    const grav = (player.vy < 0 && jumpHeld) ? 0.42 : 0.72;
    player.vy = Math.min(14, player.vy + grav * k);

    moveAndCollide(k);
    if (player.inv > 0) player.inv -= dt;

    // fell into a pit
    if (player.y > ROWS * T + 60) { player.inv = 0; killPlayer(); if (!player.dead && lives > 0) resetPlayer(); }

    // coins
    for (const c of coins) {
      if (!c.taken && Math.abs(player.x + player.w/2 - c.x) < 24 && Math.abs(player.y + player.h/2 - c.y) < 28) {
        c.taken = true; coinCount++; score += 10; sfx.coin();
      }
    }
    // flag
    if (player.x + player.w > flagX - 4 && !won) { endGame(true); }
  } else {
    player.vy += 0.72 * k; player.y += player.vy * k;   // death hop
  }

  // enemies
  for (const e of enemies) {
    if (!e.alive) { e.dead += dt; continue; }
    const onScreen = e.x > cam - 80 && e.x < cam + viewW + 80;
    if (!onScreen) continue;
    e.x += e.vx * k;
    // turn at walls
    const frontX = e.vx < 0 ? e.x : e.x + e.w;
    if (solid(tileAt(frontX, e.y + e.h - 4))) { e.vx *= -1; e.x += e.vx * k * 2; }
    // turn at ledges
    if (!solid(tileAt(frontX, e.y + e.h + 6))) e.vx *= -1;
    // gravity-snap to ground
    if (!solid(tileAt(e.x + e.w/2, e.y + e.h + 1))) e.y += 3 * k;
    else e.y = Math.floor((e.y + e.h) / T) * T - e.h;

    // player collision
    if (!player.dead && player.inv <= 0 &&
        player.x < e.x + e.w && player.x + player.w > e.x &&
        player.y < e.y + e.h && player.y + player.h > e.y) {
      if (player.vy > 1.5 && player.y + player.h - e.y < 20) {
        e.alive = false; e.dead = 0; score += 100; sfx.stomp();
        player.vy = -8.5; jumpHeld = false;
      } else killPlayer();
    }
  }

  player.anim += Math.abs(player.vx) * k * 0.12;

  // camera
  const target = player.x - viewW * 0.38;
  cam += (target - cam) * Math.min(1, 8 * dt);
  cam = Math.max(0, Math.min(levelW - viewW, cam));
}

function moveAndCollide(k) {
  // X axis
  player.x += player.vx * k;
  if (player.vx > 0) {
    if (solid(tileAt(player.x + player.w, player.y + 4)) || solid(tileAt(player.x + player.w, player.y + player.h - 4))) {
      player.x = Math.floor((player.x + player.w) / T) * T - player.w - 0.01; player.vx = 0;
    }
  } else if (player.vx < 0) {
    if (solid(tileAt(player.x, player.y + 4)) || solid(tileAt(player.x, player.y + player.h - 4))) {
      player.x = (Math.floor(player.x / T) + 1) * T + 0.01; player.vx = 0;
    }
  }
  // Y axis
  player.y += player.vy * k;
  player.onGround = false;
  if (player.vy > 0) {
    if (solid(tileAt(player.x + 4, player.y + player.h)) || solid(tileAt(player.x + player.w - 4, player.y + player.h))) {
      player.y = Math.floor((player.y + player.h) / T) * T - player.h - 0.01;
      player.vy = 0; player.onGround = true;
    }
  } else if (player.vy < 0) {
    const lx = player.x + 4, rx = player.x + player.w - 4;
    if (solid(tileAt(lx, player.y)) || solid(tileAt(rx, player.y))) {
      // bonk: pop ?-blocks
      const cy = Math.floor(player.y / T);
      for (const px of [lx, rx]) {
        const cx = Math.floor(px / T);
        if (grid[cx] && grid[cx][cy] === 3) {
          grid[cx][cy] = 4; coinCount++; score += 10; sfx.coin();
          coins.push({x: cx*T + T/2, y: cy*T - T/2, taken: false, t: 0, pop: 0.5});
        } else if (grid[cx] && solid(grid[cx][cy])) sfx.block();
      }
      player.y = (cy + 1) * T + 0.01; player.vy = 0;
    }
  }
}

function endGame(win) {
  won = win; running = false;
  if (win) { score += 1000; sfx.win(); }
  setTimeout(() => {
    document.getElementById('endTitle').textContent = win ? '🏆 YOU WIN!' : 'GAME OVER';
    document.getElementById('endStats').innerHTML =
      'Score: <b>' + score + '</b> &nbsp;&bull;&nbsp; Coins: <b>' + coinCount + '</b>';
    document.getElementById('end').classList.remove('hidden');
  }, win ? 1200 : 600);
}

// ---------- Rendering ----------
function draw() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  // sky
  const sky = ctx.createLinearGradient(0, 0, 0, VIEW_H);
  sky.addColorStop(0, '#5c94fc'); sky.addColorStop(.7, '#8ec5ff'); sky.addColorStop(1, '#c8e6ff');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, viewW, VIEW_H);

  // parallax hills & clouds
  drawHills(cam * 0.3, '#7ec850', 90);
  drawHills(cam * 0.5 + 400, '#5fb53a', 60);
  drawClouds(cam * 0.2);

  ctx.save();
  ctx.translate(-cam, 0);

  // tiles
  const c0 = Math.max(0, Math.floor(cam / T) - 1), c1 = Math.min(COLS - 1, Math.ceil((cam + viewW) / T) + 1);
  for (let cx = c0; cx <= c1; cx++) for (let cy = 0; cy < ROWS; cy++) {
    const t = grid[cx][cy]; if (!t) continue;
    const x = cx * T, y = cy * T;
    if (t === 1) { // ground
      ctx.fillStyle = '#c8814f'; ctx.fillRect(x, y, T, T);
      ctx.fillStyle = grid[cx][cy-1] === 1 ? '#b06f40' : '#7ec850';
      ctx.fillRect(x, y, T, 8);
      ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.fillRect(x + T - 3, y, 3, T);
    } else if (t === 2) { // brick
      ctx.fillStyle = '#b8542e'; ctx.fillRect(x, y, T, T);
      ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 2;
      ctx.strokeRect(x+1, y+1, T-2, T-2);
      ctx.beginPath(); ctx.moveTo(x, y + T/2); ctx.lineTo(x + T, y + T/2);
      ctx.moveTo(x + T/2, y); ctx.lineTo(x + T/2, y + T/2); ctx.stroke();
    } else if (t === 3) { // ?-block
      ctx.fillStyle = '#ffae00'; ctx.fillRect(x, y, T, T);
      ctx.strokeStyle = '#7a4a00'; ctx.lineWidth = 3; ctx.strokeRect(x+2, y+2, T-4, T-4);
      ctx.fillStyle = '#7a4a00'; ctx.font = 'bold 22px Arial'; ctx.textAlign = 'center';
      ctx.fillText('?', x + T/2, y + T - 8);
    } else if (t === 4) { // used block
      ctx.fillStyle = '#9c6b3c'; ctx.fillRect(x, y, T, T);
      ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 3; ctx.strokeRect(x+2, y+2, T-4, T-4);
    } else if (t === 5) { // pipe
      const leftCol = !(grid[cx-1] && grid[cx-1][cy] === 5);
      const topRow = !(grid[cx][cy-1] === 5);
      ctx.fillStyle = '#2e9e3e'; ctx.fillRect(x, y, T, T);
      ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(x + (leftCol ? 4 : 0), y, 6, T);
      if (topRow) { ctx.fillStyle = '#27862f'; ctx.fillRect(x - (leftCol ? 3 : 0), y, T + 3, 10); }
    }
  }

  // coins
  for (const c of coins) {
    if (c.taken) continue;
    c.t += 0.1;
    if (c.pop !== undefined && c.pop > 0) { c.pop -= 0.02; c.y -= 1.2; }
    const squish = Math.abs(Math.cos(c.t));
    ctx.save(); ctx.translate(c.x, c.y + Math.sin(c.t * 0.7) * 2); ctx.scale(squish, 1);
    ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(0, 0, 10, 0, 7); ctx.fill();
    ctx.strokeStyle = '#c8901a'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = '#c8901a'; ctx.fillRect(-2, -5, 4, 10);
    ctx.restore();
  }

  // flag
  drawFlag(flagX, (ROWS - 2) * T);

  // enemies
  for (const e of enemies) {
    if (!e.alive && e.dead > 0.4) continue;
    const squash = e.alive ? 1 : 0.3;
    const x = e.x, y = e.y + e.h * (1 - squash), h = e.h * squash;
    ctx.fillStyle = '#8c5a2b';
    ctx.beginPath();
    ctx.moveTo(x, y + h); ctx.quadraticCurveTo(x + e.w/2, y - h*0.45, x + e.w, y + h);
    ctx.closePath(); ctx.fill();
    if (e.alive) {
      const step = Math.sin(time * 12) * 3;
      ctx.fillStyle = '#5a3a1a';
      ctx.beginPath(); ctx.ellipse(x + 7, y + h, 7, 4 + step*0.4, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x + e.w - 7, y + h, 7, 4 - step*0.4, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(x + 9, y + h*0.45, 4.5, 0, 7); ctx.arc(x + e.w - 9, y + h*0.45, 4.5, 0, 7); ctx.fill();
      ctx.fillStyle = '#000';
      const lx = e.vx < 0 ? -1.5 : 1.5;
      ctx.beginPath(); ctx.arc(x + 9 + lx, y + h*0.45, 2, 0, 7); ctx.arc(x + e.w - 9 + lx, y + h*0.45, 2, 0, 7); ctx.fill();
      ctx.strokeStyle = '#3a2510'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x + 5, y + h*0.28); ctx.lineTo(x + 13, y + h*0.34);
      ctx.moveTo(x + e.w - 5, y + h*0.28); ctx.lineTo(x + e.w - 13, y + h*0.34); ctx.stroke();
    }
  }

  // player
  if (!(player.inv > 0 && Math.floor(time * 12) % 2 === 0)) drawPlayer();

  ctx.restore();

  drawHUD();
  if (running) drawTouchButtons();
}

function drawPlayer() {
  const p = player;
  const px = p.x + p.w/2, headR = 15;
  const bob = p.onGround ? Math.abs(Math.sin(p.anim)) * 2 : 0;
  ctx.save();
  ctx.translate(px, p.y);

  // legs
  const legSwing = p.onGround && Math.abs(p.vx) > 0.3 ? Math.sin(p.anim * 2) * 6 : (p.onGround ? 0 : 4);
  ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-5, p.h - 14); ctx.lineTo(-5 + legSwing, p.h - 2);
  ctx.moveTo(5, p.h - 14); ctx.lineTo(5 - legSwing, p.h - 2);
  ctx.stroke();
  // shoes
  ctx.fillStyle = shorts;
  ctx.beginPath(); ctx.ellipse(-5 + legSwing + 2*p.face, p.h - 2, 6, 3.5, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(5 - legSwing + 2*p.face, p.h - 2, 6, 3.5, 0, 0, 7); ctx.fill();

  // body (shirt)
  ctx.fillStyle = shirt;
  ctx.beginPath();
  ctx.moveTo(-10, 24); ctx.lineTo(10, 24); ctx.lineTo(12, p.h - 16); ctx.lineTo(-12, p.h - 16);
  ctx.closePath(); ctx.fill();
  // arms
  const armSwing = p.onGround ? Math.sin(p.anim * 2) * 5 : -8;
  ctx.strokeStyle = shirt; ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(-10, 27); ctx.lineTo(-13 - armSwing * 0.5, 38 - (p.onGround ? 0 : 6));
  ctx.moveTo(10, 27); ctx.lineTo(13 + armSwing * 0.5, 38 - (p.onGround ? 0 : 6));
  ctx.stroke();

  // head: circular photo
  const hy = headR - bob;
  ctx.save();
  ctx.beginPath(); ctx.arc(0, hy, headR, 0, 7); ctx.clip();
  ctx.save();
  if (p.face < 0) ctx.scale(-1, 1);
  if (charImg.complete && charImg.naturalWidth) ctx.drawImage(charImg, -headR, hy - headR, headR*2, headR*2);
  else { ctx.fillStyle = '#e8b88a'; ctx.fillRect(-headR, hy - headR, headR*2, headR*2); }
  ctx.restore();
  ctx.restore();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(0, hy, headR, 0, 7); ctx.stroke();

  ctx.restore();
}

function drawFlag(x, groundY) {
  ctx.fillStyle = '#ddd';
  ctx.fillRect(x, groundY - 9.5 * T, 5, 9.5 * T);
  ctx.fillStyle = '#ffd23f';
  ctx.beginPath(); ctx.arc(x + 2.5, groundY - 9.5 * T, 7, 0, 7); ctx.fill();
  const wave = Math.sin(time * 4) * 4;
  ctx.fillStyle = '#d83a3a';
  ctx.beginPath();
  ctx.moveTo(x + 5, groundY - 9.3 * T);
  ctx.lineTo(x + 5 + 52, groundY - 8.8 * T + wave);
  ctx.lineTo(x + 5, groundY - 8.3 * T);
  ctx.closePath(); ctx.fill();
  // castle silhouette
  ctx.fillStyle = '#9c6b3c';
  const cx = x + 90, cy = groundY;
  ctx.fillRect(cx, cy - 96, 120, 96);
  ctx.fillRect(cx + 30, cy - 140, 60, 50);
  ctx.fillStyle = '#7a4f28';
  for (let i = 0; i < 4; i++) ctx.fillRect(cx + i * 32, cy - 108, 18, 14);
  ctx.fillRect(cx + 30 + 8, cy - 152, 14, 14); ctx.fillRect(cx + 30 + 38, cy - 152, 14, 14);
  ctx.fillStyle = '#3a2510';
  ctx.beginPath(); ctx.arc(cx + 60, cy - 26, 18, Math.PI, 0); ctx.fill();
  ctx.fillRect(cx + 42, cy - 26, 36, 26);
}

function drawHills(off, color, h) {
  ctx.fillStyle = color;
  const w = 280;
  for (let i = -1; i < viewW / w + 2; i++) {
    const x = i * w - (off % w);
    ctx.beginPath();
    ctx.arc(x + w/2, VIEW_H - 64 + h*0.2, h, Math.PI, 0);
    ctx.fill();
  }
  ctx.fillRect(0, VIEW_H - 64, viewW, 64);
}
function drawClouds(off) {
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  const w = 340;
  for (let i = -1; i < viewW / w + 2; i++) {
    const x = i * w - (off % w), y = 60 + (i % 3) * 36;
    ctx.beginPath();
    ctx.arc(x, y, 20, 0, 7); ctx.arc(x + 24, y - 10, 24, 0, 7); ctx.arc(x + 50, y, 20, 0, 7);
    ctx.fill();
  }
}

function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  roundRect(12, 10, 230, 38, 10); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 17px Arial'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('🪙 ' + coinCount, 24, 30);
  ctx.fillText('★ ' + score, 92, 30);
  // lives as mini faces
  for (let i = 0; i < lives; i++) {
    const lx = 182 + i * 22, ly = 29;
    ctx.save();
    ctx.beginPath(); ctx.arc(lx, ly, 9, 0, 7); ctx.clip();
    if (charImg.complete && charImg.naturalWidth) ctx.drawImage(charImg, lx - 9, ly - 9, 18, 18);
    ctx.restore();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(lx, ly, 9, 0, 7); ctx.stroke();
  }
}

function drawTouchButtons() {
  const r = btnRects();
  for (const [k, b] of Object.entries(r)) {
    ctx.fillStyle = keys[k === 'jump' ? 'jump' : k] ? 'rgba(255,255,255,.45)' : 'rgba(255,255,255,.22)';
    roundRect(b.x, b.y, b.w, b.h, 16); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2;
    roundRect(b.x, b.y, b.w, b.h, 16); ctx.stroke();
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.font = 'bold ' + (b.h * 0.42) + 'px Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const label = k === 'left' ? '◀' : k === 'right' ? '▶' : 'A';
    ctx.fillText(label, b.x + b.w/2, b.y + b.h/2 + 2);
  }
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ---------- Main loop ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (running) update(dt); else time += dt;
  draw();
  requestAnimationFrame(loop);
}
buildLevel();          // so the background renders behind the menu
resetPlayer();
requestAnimationFrame(loop);

// ---------- UI wiring ----------
document.getElementById('charRed').addEventListener('click', () => startGame('red'));
document.getElementById('charBlue').addEventListener('click', () => startGame('blue'));
document.getElementById('againBtn').addEventListener('click', () => {
  document.getElementById('end').classList.add('hidden');
  document.getElementById('menu').classList.remove('hidden');
});
</script>
